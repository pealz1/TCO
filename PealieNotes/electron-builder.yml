appId: com.pealie.notes
productName: Pealie Notes
directories:
  output: dist
win:
  target:
    - nsis
    - portable
  icon: src/assets/icon.svg
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
files:
  - src/**/*
  - node_modules/**/*
  - "!**/*.test.js"
  - "!tests/**/*"
asar: true
