<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Notepad body -->
  <rect x="40" y="24" width="160" height="200" rx="16" ry="16" fill="#f5f5f7" filter="url(#shadow)" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Header bar -->
  <rect x="40" y="24" width="160" height="32" rx="16" ry="16" fill="#5865F2"/>
  <rect x="40" y="40" width="160" height="16" fill="#5865F2"/>
  <!-- Text lines -->
  <rect x="64" y="80" width="112" height="6" rx="3" fill="#ccc"/>
  <rect x="64" y="100" width="96" height="6" rx="3" fill="#ddd"/>
  <rect x="64" y="120" width="104" height="6" rx="3" fill="#ccc"/>
  <rect x="64" y="140" width="72" height="6" rx="3" fill="#ddd"/>
  <!-- Pencil -->
  <g transform="translate(160, 140) rotate(45)">
    <rect x="-6" y="-60" width="12" height="52" rx="2" fill="#5865F2"/>
    <rect x="-6" y="-64" width="12" height="8" rx="1" fill="#4752C4"/>
    <polygon points="-6,-8 6,-8 0,6" fill="#FFD54F"/>
    <polygon points="-2,2 2,2 0,6" fill="#333"/>
  </g>
</svg>
