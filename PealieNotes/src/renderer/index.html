<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:;" />
  <title>Pealie Notes</title>

  <link rel="stylesheet" href="./styles/main.css" />
  <link rel="stylesheet" href="./styles/themes.css" />
  <link rel="stylesheet" href="./styles/animations.css" />
  <link rel="stylesheet" href="./styles/titlebar.css" />
  <link rel="stylesheet" href="./styles/sidebar.css" />
  <link rel="stylesheet" href="./styles/notesList.css" />
  <link rel="stylesheet" href="./styles/editor.css" />
  <link rel="stylesheet" href="./styles/statusBar.css" />
  <link rel="stylesheet" href="./styles/settings.css" />
  <link rel="stylesheet" href="./styles/welcome.css" />
  <link rel="stylesheet" href="./styles/contextMenu.css" />
  <link rel="stylesheet" href="./styles/panels.css" />
  <link rel="stylesheet" href="./styles/modal.css" />
</head>
<body>
  <div id="app">
    <div id="titlebar"></div>

    <div id="main-content">
      <div id="sidebar"></div>
      <div id="resize-handle-1" class="resize-handle"></div>
      <div id="notes-list"></div>
      <div id="resize-handle-2" class="resize-handle"></div>

      <div id="editor-panel">
        <div id="toolbar"></div>
        <div id="editor-container"></div>
        <div id="status-bar"></div>
      </div>
    </div>

    <div id="settings-panel" style="display:none;"></div>
    <div id="welcome-screen" style="display:none;"></div>
  </div>

  <div id="context-menu-container"></div>
  <div id="modal-container"></div>

  <script src="./bundle.js"></script>
</body>
</html>
